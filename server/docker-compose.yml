# 只起 app 服务，MySQL 为外部数据库（如阿里云 RDS），通过 .env 的 DB_HOST 连接。
services:
  app:
    build: .
    container_name: schedule-server
    restart: unless-stopped
    ports:
      # 宿主暴露端口（.env 的 HOST_PORT），容器内固定 8080
      - "${HOST_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      # 容器内监听固定 8080，避免和宿主映射端口混淆
      SERVER_PORT: "8080"
      TZ: ${TZ:-Asia/Shanghai}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
