name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    # app/schemas 是迁移链唯一的物证：改了实体却忘了重新生成/提交快照，
    # 或者版本号与快照对不上，都会在这里红掉，避免带着不一致的结构发版
    # （用户升级时 Room 校验失败直接闪退，见 docs/数据库迁移安全与闪退排查.md）。
    - name: Verify Room schema snapshots are committed
      run: |
        if [ -n "$(git status --porcelain -- app/schemas)" ]; then
          echo "::error::app/schemas 有未提交/未生成的变更，请按 CONTRIBUTING「数据库迁移约定」重新构建并提交快照"
          git status --porcelain -- app/schemas
          exit 1
        fi

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: app/build/reports/tests/testDebugUnitTest

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk

  # Room 迁移测试（AppDatabaseMigrationTest）必须在真 SQLite 上跑：
  # JVM 单测只校验版本号/迁移链，不执行任何迁移 SQL，迁移写错也全绿。
  # 同时在 API 35（现代）和 API 29（Android 10，兼容性回归下限附近）两台模拟器上跑：
  #   - API 35：验证迁移/自愈；
  #   - API 29：验证 minSdk 26 世代的资源解析差异（历史事故：res/color-night-* 被当 Drawable，
  #     深色模式启动必崩；见 MainActivityNightModeTest / ColorStateListAsDrawableTest）。
  androidTest:
    name: androidTest (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 29]

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Cache Gradle packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    # GitHub 托管的 Ubuntu runner 上 KVM 需要显式放开权限，否则模拟器只能软件模拟、慢到超时。
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm

    - name: Run instrumented tests on emulator
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: ${{ matrix.api-level }}
        target: google_apis
        arch: x86_64
        disable-animations: true
        emulator-boot-timeout: 900
        script: ./gradlew connectedDebugAndroidTest

    - name: Upload androidTest report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: androidTest-report-api${{ matrix.api-level }}
        path: |
          app/build/reports/androidTests/connected
          app/build/outputs/androidTest-results/connected
