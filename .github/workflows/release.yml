name: Build and Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        run: |
          SDKMANAGER=$(find ${ANDROID_HOME}/cmdline-tools -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found, relying on Gradle to download SDK"
            exit 0
          fi
          yes | ${SDKMANAGER} --licenses > /dev/null 2>&1 || true
          ${SDKMANAGER} "platforms;android-35" "build-tools;35.0.0" || true

      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/v}
          NUMS=($(echo "${TAG}" | grep -oP '\d+' | head -3))
          MAJOR=${NUMS[0]:-0}
          MINOR=${NUMS[1]:-0}
          PATCH=${NUMS[2]:-0}
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "VERSION=${TAG}" >> $GITHUB_OUTPUT
          echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_OUTPUT

      - name: Sync version to build.gradle
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.VERSION_CODE }}/" app/build.gradle
          sed -i "s/versionName = \".*\"/versionName = \"${{ steps.version.outputs.VERSION }}\"/" app/build.gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > wakeup-schedule-key.jks

      - name: Build Release APK
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Extract release notes from tag
        id: release_notes
        run: |
          # 获取当前 tag 的 annotated message（去掉第一行标题）
          TAG_NAME=${GITHUB_REF#refs/tags/}
          NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME" | tail -n +2)
          # 多行输出用 heredoc 方式写入 GITHUB_OUTPUT
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo EOF
          } >> $GITHUB_OUTPUT

      # 上传 universal 包到更新服务器（软失败：后端临时故障不阻断 GitHub Release）
      - name: Upload universal APK to update server
        env:
          UPDATE_SERVER_URL: ${{ secrets.UPDATE_SERVER_URL }}
          UPDATE_SERVER_API_KEY: ${{ secrets.UPDATE_SERVER_API_KEY }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          if [ -z "$UPDATE_SERVER_URL" ] || [ -z "$UPDATE_SERVER_API_KEY" ]; then
            echo "::warning::未配置 UPDATE_SERVER_URL / UPDATE_SERVER_API_KEY secrets，跳过上传更新服务器"
            exit 0
          fi
          UNIVERSAL_APK=$(ls app/build/outputs/apk/release/*-universal.apk 2>/dev/null | head -1 || true)
          if [ -z "$UNIVERSAL_APK" ]; then
            echo "::warning::未找到 universal APK，跳过上传更新服务器"
            exit 0
          fi
          printf '%s' "$RELEASE_NOTES" > /tmp/changelog.txt
          # versionCode 口径：AGP 的 ABI splits 会把 BuildConfig.VERSION_CODE 生成为 base*10（universal 口径），
          # App 上报的就是这个值，因此上传时也必须传 base*10，否则更新检查永远判成已是最新。
          UNIVERSAL_VERSION_CODE=$(( ${{ steps.version.outputs.VERSION_CODE }} * 10 ))
          curl -sS --retry 3 --retry-delay 2 -f -X POST "${UPDATE_SERVER_URL}/api/v1/releases/upload" \
            -H "X-API-Key: ${UPDATE_SERVER_API_KEY}" \
            -F "appKey=schedule" \
            -F "versionCode=${UNIVERSAL_VERSION_CODE}" \
            -F "versionName=${{ steps.version.outputs.VERSION }}" \
            -F "name=西大课栈" \
            -F "changelog=</tmp/changelog.txt" \
            -F "file=@${UNIVERSAL_APK}" \
            || echo "::warning::上传更新服务器失败（已忽略，GitHub Release 正常发布）"

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.VERSION }}
          files: app/build/outputs/apk/release/*.apk
          body: ${{ steps.release_notes.outputs.notes }}
