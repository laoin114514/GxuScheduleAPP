import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.devtools.ksp' version '1.9.24-1.0.20'
}



android {
    namespace = 'com.cherry.wakeupschedule'
    compileSdk = 35

    defaultConfig {
        applicationId = "com.cherry.wakeupschedule"
        minSdk = 26
        targetSdk = 35
        versionCode = 0001
        versionName = "0.0.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.each { output ->
            def versionCodes = ['armeabi-v7a': 1, 'arm64-v8a': 2, 'x86_64': 3, 'universal': 0]
            def abi = output.getFilter(com.android.build.OutputFile.ABI)
            def baseVersionCode = android.defaultConfig.versionCode
            
            if (abi == null) {
                // Universal APK
                output.versionCodeOverride = baseVersionCode * 10 + 0
                output.outputFileName = "GxuScheduleAPP-${variant.buildType.name}-${defaultConfig.versionName}-universal.apk"
            } else {
                // Specific ABI APK
                output.versionCodeOverride = baseVersionCode * 10 + versionCodes.get(abi)
                output.outputFileName = "GxuScheduleAPP-${variant.buildType.name}-${defaultConfig.versionName}-${abi}.apk"
            }
        }
    }

    signingConfigs {
        release {
            storeFile = file("../wakeup-schedule-key.jks")
            storePassword = project.findProperty("RELEASE_STORE_PASSWORD") ?: ""
            keyAlias = "wakeup_schedule"
            keyPassword = project.findProperty("RELEASE_KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            // R8：代码压缩 + 资源压缩。规则见 app/proguard-rules.pro
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.release
        }
    }

    // Room 导出的 schema 快照落在 app/schemas/，既用于 migration 测试（打进 androidTest assets），
    // 也是唯一能证明「哪天改了实体忘了写迁移」的凭据。该目录必须提交进 git。
    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
    }
    
    packagingOptions {
        exclude('META-INF/INDEX.LIST')
        exclude('META-INF/DEPENDENCIES')
        exclude('META-INF/groovy-release-info.properties')
        exclude('META-INF/groovy/**')
        exclude('META-INF/groovy-dateutil/**')
        exclude('META-INF/LICENSE.md')
        exclude('META-INF/NOTICE.md')
        pickFirst('META-INF/groovy-release-info.properties')
    }
    
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
        freeCompilerArgs += ["-Xjvm-default=all"]
    }
    
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    
    lint {
        baseline = file("lint-baseline.xml")
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.5'

    // ViewPager2 for swipe gestures
    implementation 'androidx.viewpager2:viewpager2:1.1.0'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.6.4'

    // Network —— 全项目只用裸 OkHttp（教务抓取、更新包下载、WebView 之外的下载），
    // 从未引入 Retrofit。版本与 gxuJwxtJavaClient 对齐，避免依赖决议时被静默换版
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Gson —— 教务客户端对上暴露的是 implementation 依赖，Gson 不会传递到 app 模块，
    // 而 app 侧 JwxtAccountManager / CourseDataManager / TimeTableManager 都直接用它反射
    implementation 'com.google.code.gson:gson:2.10.1'

    // GXU JWXT Client (本地源码模块)
    implementation project(':gxuJwxtJavaClient')

    // Room database
    implementation "androidx.room:room-runtime:2.6.1"
    implementation "androidx.room:room-ktx:2.6.1"
    ksp "androidx.room:room-compiler:2.6.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    // MigrationTestHelper：读 app/schemas/ 的快照，验证迁移后的库结构与新版本一致
    androidTestImplementation "androidx.room:room-testing:2.6.1"
}
