<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="西大课栈 - Android 课表应用">
    <meta property="og:title" content="西大课栈 - Android 课表应用">
    <meta property="og:description" content="一款简洁优雅的 Android 课表应用">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://laoin114514.github.io/GxuScheduleAPP/">
    <meta property="og:image" content="https://laoin114514.github.io/GxuScheduleAPP/favicon.png">
    <title>西大课栈 - Android 课表应用</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: #e0e0e0;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .logo {
            width: 96px;
            height: 96px;
            border-radius: 24px;
            margin-bottom: 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 999px;
            padding: 0.4rem 1.2rem;
            font-size: 0.9rem;
            color: #a0a0b8;
            margin-bottom: 2rem;
        }

        .links {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .links a {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .link-github {
            background: rgba(255, 255, 255, 0.1);
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .link-github:hover {
            background: rgba(255, 255, 255, 0.18);
            color: #fff;
        }

        .link-release {
            background: #FF5C18;
            color: #fff;
        }

        .link-release:hover {
            background: #e04e0e;
        }

        footer {
            position: fixed;
            bottom: 1.5rem;
            font-size: 0.8rem;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <img class="logo" src="logo.png" alt="西大课栈">

        <h1>西大课栈</h1>

        <div class="badge">网站正在开发中</div>

        <div class="links">
            <a class="link-release" href="https://github.com/laoin114514/GxuScheduleAPP/releases" target="_blank">
                下载应用
            </a>
            <a class="link-github" href="https://github.com/laoin114514/GxuScheduleAPP" target="_blank">
                GitHub
            </a>
        </div>
    </div>

    <footer>© 2026 西大课栈</footer>
</body>
</html>
